
name: Sync Excel from OneDrive

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: onedrive-excel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright and IMAP libraries
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save playwright imapflow mailparser

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Sign in, retrieve MFA email and download workbook
        run: node .github/scripts/sync-onedrive.mjs
        env:
          ONEDRIVE_EMAIL: ${{ secrets.ONEDRIVE_EMAIL }}
          ONEDRIVE_PASSWORD: ${{ secrets.ONEDRIVE_PASSWORD }}
          MAIL_IMAP_HOST: ${{ secrets.MAIL_IMAP_HOST }}
          MAIL_IMAP_PORT: ${{ secrets.MAIL_IMAP_PORT }}
          MAIL_IMAP_USER: ${{ secrets.MAIL_IMAP_USER }}
          MAIL_IMAP_PASSWORD: ${{ secrets.MAIL_IMAP_PASSWORD }}
          MAIL_IMAP_FOLDER: INBOX

      - name: Commit updated workbook
        run: |
          git add -- data/venteliste.xlsx

          if git diff --cached --quiet; then
            echo "Workbook unchanged. No commit needed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Excel workbook from OneDrive"
          git push origin main
