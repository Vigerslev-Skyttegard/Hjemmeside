
name: Sync Excel from OneDrive

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

concurrency:
  group: onedrive-excel-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm init -y
          npm pkg set type=module
          npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Download workbook from OneDrive
        run: node .github/scripts/sync-onedrive.mjs
        env:
          ONEDRIVE_AUTH_BASE64: ${{ secrets.ONEDRIVE_AUTH_BASE64 }}

      - name: Commit workbook if changed
        run: |
          git add -- data/venteliste.xlsx

          if git diff --cached --quiet; then
            echo "Workbook unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update Excel workbook from OneDrive"
          git push origin main
